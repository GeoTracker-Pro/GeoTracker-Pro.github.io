- name: Qualys GitHub actions for Web Application Scanning
  uses: Qualys/github-action-qwas@v1.0.0
  with:
    # Authenticating using your GitHub Secrets and Variables
    QUALYS_USERNAME: ${{ vars.QUALYS_USERNAME }}
    QUALYS_PASSWORD: ${{ secrets.QUALYS_PASSWORD }}
    API_SERVER: ${{ vars.API_SERVER }}

    # Defining the scan details from your Variables
    SCAN_NAME: ${{ vars.SCAN_NAME }}
    SCAN_TYPE: ${{ vars.SCAN_TYPE }}
    WEBAPP_ID: ${{ vars.WEBAPP_ID }}

    # MANDATORY: Fixes the 'Invalid value for AUTH_RECORD' error
    AUTH_RECORD: none
    
    # Optional: If you use a specific profile, you can add it, 
    # but for a basic test, leaving it out uses your account defaults.
    # OPTION_PROFILE: "Initial WAS Options"
